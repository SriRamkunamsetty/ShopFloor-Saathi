[project]
name = "shopfloor-saathi"
version = "0.1.0"
description = "Voice-first, multilingual multi-agent copilot for small factories: symptom -> evidence-backed diagnosis -> human-approved work order -> impact ledger."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.12,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-firestore>=2.16",
  "firebase-admin>=6.5",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saathi*"]

[tool.setuptools.package-data]
saathi = ["data/*.csv", "data/*.json", "data/manuals/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:.*EXPERIMENTAL.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = [
  "S101",  # asserts are fine in tests
  "E501",  # `ruff format` owns line length; long string literals and prompts are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
